<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Advisors</title>
  <style>
    :root {
      --burnt-orbit: #D9613C;
      --burnt-orbit-soft: #F7C7B8;
      --dark-matter: #243041;
      --dark-matter-strong: #111827;
      --lunar-dust: #F4F7FB;
      --lunar-dust-soft: #FFFFFF;
      --surface-muted: #EEF3F8;
      --border-subtle: rgba(36, 48, 65, 0.13);
      --border-strong: rgba(36, 48, 65, 0.34);
      --neptune: #2F9B7F;
      --rocket-rose: #8B6BE8;
      --mars-clay: #9B433B;
      --blue: #3267D6;
      --amber: #B7791F;
      --muted: #667085;
      --shadow-subtle: 0 14px 34px rgba(17, 24, 39, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--lunar-dust);
      color: var(--dark-matter);
      font-family: "Inter", "Space Grotesk", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
    }
    a { color: var(--burnt-orbit); text-decoration: none; }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--lunar-dust-soft);
      border-bottom: 1px solid var(--border-subtle);
      box-shadow: 0 1px 0 rgba(17, 24, 39, 0.02);
    }
    nav a { margin-right: 12px; font-weight: 700; color: var(--dark-matter); font-size: 14px; }
    nav a:last-child { margin-right: 0; }
    .container {
      max-width: 1340px;
      margin: 24px auto 48px auto;
      padding: 0 20px;
    }
    h1, h2, h3, h4 {
      color: var(--dark-matter-strong);
      font-family: "Space Grotesk", "Inter", sans-serif;
      letter-spacing: 0;
    }
    .card {
      background: var(--lunar-dust-soft);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 18px;
      box-shadow: var(--shadow-subtle);
      margin-bottom: 16px;
    }
    .btn {
      background: var(--burnt-orbit);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background: #C95432; }
    .btn.secondary {
      background: #fff;
      color: var(--dark-matter);
      border: 1px solid var(--border-subtle);
    }
    .btn.secondary:hover { border-color: var(--border-strong); background: var(--surface-muted); }
    .btn.danger { background: var(--mars-clay); }
    button[disabled] { opacity: 0.6; cursor: not-allowed; }
    label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 14px; }
    input[type="text"], textarea, select, input[type="number"], input[type="range"] {
      width: 100%;
      background: #fff;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--dark-matter);
      margin-bottom: 12px;
      font-size: 14px;
    }
    input[type="text"]:focus, textarea:focus, select:focus, input[type="number"]:focus {
      outline: 2px solid rgba(50, 103, 214, 0.22);
      border-color: rgba(50, 103, 214, 0.5);
    }
    input[type="range"] { padding: 0; }
    textarea { min-height: 140px; resize: vertical; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .advisor-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      margin-top: 12px;
    }
    .selection-slot {
      min-width: 0;
    }
    .selection-slot label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .run-controls {
      display: grid;
      gap: 12px;
      grid-template-columns: minmax(220px, 1fr) minmax(170px, 220px) minmax(150px, 190px);
      align-items: end;
      margin-top: 10px;
    }
    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-bottom: 7px;
      padding: 7px 8px;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      background: #fff;
      font-weight: 600;
      cursor: pointer;
      word-break: break-word;
    }
    .check-row input {
      width: auto;
      margin: 0;
      flex: 0 0 auto;
    }
    .check-row span {
      min-width: 0;
    }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--lunar-dust);
      border: 1px solid var(--border-subtle);
      margin: 2px 6px 2px 0;
      color: var(--dark-matter);
      font-size: 12px;
      font-weight: 600;
    }
    .pill.success { background: rgba(47, 155, 127, 0.12); border-color: rgba(47, 155, 127, 0.28); color: #155D4C; }
    .pill.error { background: rgba(155, 67, 59, 0.13); border-color: rgba(155, 67, 59, 0.3); color: #7B2E28; }
    details {
      background: #fff;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    summary { cursor: pointer; font-weight: 700; font-size: 14px; }
    pre {
      white-space: pre-wrap;
      background: var(--lunar-dust-soft);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      color: var(--dark-matter);
    }
    .status {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
      border: 1px solid var(--border-subtle);
      background: #fff;
      color: var(--dark-matter);
    }
    .status.pending { background: var(--lunar-dust); color: var(--dark-matter); }
    .status.running { background: var(--neptune); color: var(--dark-matter); }
    .status.done { background: var(--burnt-orbit-soft); color: var(--dark-matter); }
    .status.error { background: var(--mars-clay); color: #fff; }
    .status.cancelled { background: var(--mars-clay); color: #fff; }
    .workspace-header {
      display: grid;
      gap: 14px;
    }
    .workspace-title-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
    }
    .conversation-title {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.1;
    }
    .page-eyebrow {
      margin: 0 0 6px 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .question-text {
      margin: 4px 0 0 0;
      max-width: 920px;
      color: var(--dark-matter);
      font-size: 16px;
      line-height: 1.55;
    }
    .action-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }
    .metadata-strip {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .stats-strip {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }
    .stat-tile {
      background: #fff;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
    }
    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .stat-value {
      display: block;
      margin-top: 5px;
      color: var(--dark-matter-strong);
      font-size: 20px;
      font-weight: 800;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }
    .stat-note {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .conversation-layout {
      display: grid;
      grid-template-columns: minmax(230px, 280px) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .run-sidebar {
      position: sticky;
      top: 78px;
    }
    .sidebar-section + .sidebar-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
    }
    .sidebar-title {
      margin: 0 0 10px 0;
      color: var(--dark-matter-strong);
      font-size: 14px;
    }
    .timeline-list {
      display: grid;
      gap: 8px;
    }
    .timeline-link {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 9px;
      align-items: start;
      color: var(--dark-matter);
      padding: 8px;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      background: #fff;
    }
    .timeline-link:hover { border-color: var(--border-strong); }
    .timeline-index {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--surface-muted);
      color: var(--dark-matter-strong);
      font-weight: 800;
      font-size: 12px;
    }
    .timeline-main {
      min-width: 0;
      font-weight: 800;
      font-size: 13px;
    }
    .timeline-meta {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
    }
    .final-answer {
      border-left: 4px solid var(--neptune);
    }
    .answer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .markdown-surface {
      background: #fff;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 16px;
      color: var(--dark-matter);
      line-height: 1.6;
    }
    .markdown-surface > :first-child { margin-top: 0; }
    .markdown-surface > :last-child { margin-bottom: 0; }
    .markdown-surface table {
      width: 100%;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
    }
    .markdown-surface th, .markdown-surface td {
      border: 1px solid var(--border-subtle);
      padding: 8px 10px;
      text-align: left;
    }
    .stage-breakdown {
      display: grid;
      gap: 8px;
    }
    .stage-breakdown-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      color: var(--dark-matter);
      font-size: 13px;
    }
    .section-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .section-title-row h3, .section-title-row h4 {
      margin: 0;
    }
    .live-status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .run-matrix {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }
    .run-matrix-row {
      display: grid;
      grid-template-columns: minmax(170px, 1.4fr) repeat(3, minmax(92px, 0.8fr));
      gap: 8px;
      align-items: stretch;
    }
    .run-matrix-head {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .run-cell {
      background: #fff;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 9px 10px;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .run-cell.empty { color: var(--muted); background: var(--surface-muted); }
    .provider-cell {
      justify-content: flex-start;
      font-weight: 800;
      overflow: hidden;
    }
    .response-list {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      align-items: stretch;
    }
    .turn-response-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: minmax(220px, 2fr) minmax(220px, 2fr) minmax(180px, 1fr);
      align-items: start;
    }
    .turn-card {
      scroll-margin-top: 86px;
    }
    .turn-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .turn-kicker {
      margin: 0 0 4px 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .turn-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .response-section h4 {
      margin: 0 0 8px 0;
    }
    .response-button {
      width: 100%;
      min-height: 112px;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      background: #fff;
      color: var(--dark-matter);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      cursor: pointer;
      font-weight: 700;
      text-align: left;
      min-width: 0;
    }
    .response-button:hover {
      border-color: var(--border-strong);
      background: #FDFEFF;
    }
    .response-button:focus-visible {
      outline: 2px solid rgba(50, 103, 214, 0.28);
      outline-offset: 2px;
    }
    .response-provider-line {
      width: 100%;
      display: flex;
      gap: 7px;
      align-items: center;
      min-width: 0;
    }
    .provider-token {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      max-width: 72px;
      padding: 3px 7px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--surface-muted);
      color: var(--dark-matter);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .provider-codex { background: rgba(50, 103, 214, 0.11); color: #1E4BA8; border-color: rgba(50, 103, 214, 0.22); }
    .provider-gemini { background: rgba(139, 107, 232, 0.13); color: #5A3EB6; border-color: rgba(139, 107, 232, 0.28); }
    .provider-ollama { background: rgba(47, 155, 127, 0.13); color: #126049; border-color: rgba(47, 155, 127, 0.28); }
    .provider-claude { background: rgba(183, 121, 31, 0.14); color: #7C4C12; border-color: rgba(183, 121, 31, 0.3); }
    .response-provider {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      line-height: 1.25;
    }
    .response-snippet {
      width: 100%;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .response-meta {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-start;
      width: 100%;
    }
    .conversation-list {
      display: grid;
      gap: 10px;
    }
    .conversation-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      background: #fff;
    }
    .conversation-row:hover { border-color: var(--border-strong); }
    .conversation-link {
      display: inline-block;
      color: var(--dark-matter-strong);
      font-weight: 800;
      margin-bottom: 4px;
    }
    .conversation-question {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .conversation-side {
      text-align: right;
      display: grid;
      gap: 6px;
      justify-items: end;
    }
    .sample-prompts {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: -4px 0 14px 0;
    }
    .sample-prompt {
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      background: #fff;
      color: var(--dark-matter);
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .sample-prompt:hover { border-color: var(--border-strong); background: var(--surface-muted); }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(31, 31, 31, 0.58);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal-panel {
      width: min(980px, 100%);
      max-height: min(86vh, 900px);
      background: var(--lunar-dust-soft);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .modal-title {
      margin: 0;
      font-size: 16px;
      font-family:'Space Grotesk','Inter',sans-serif;
      word-break: break-word;
    }
    .modal-heading {
      min-width: 0;
    }
    .modal-context {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .modal-close {
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      background: #fff;
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-weight: 800;
      color: var(--dark-matter);
    }
    .modal-body {
      padding: 16px;
      overflow: auto;
    }
    .modal-content {
      background: #fff;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 14px;
      color: var(--dark-matter);
    }
    .modal-content > :first-child { margin-top: 0; }
    .modal-content > :last-child { margin-bottom: 0; }
    .modal-content pre {
      max-height: none;
      overflow: auto;
      background: var(--lunar-dust-soft);
    }
    .modal-content code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.92em;
    }
    .compare-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      align-items: start;
    }
    .compare-panel {
      background: #fff;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      min-width: 0;
      overflow: hidden;
    }
    .compare-panel-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--surface-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .compare-panel-body {
      padding: 12px;
      line-height: 1.55;
    }

    p:has(button#start-btn) {
      text-align: right;
    }
    @media (max-width: 760px) {
      .run-controls {
        grid-template-columns: 1fr;
      }
      .turn-response-grid {
        grid-template-columns: 1fr;
      }
      .response-list {
        grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      }
      .workspace-title-row,
      .turn-header,
      .conversation-row {
        grid-template-columns: 1fr;
        display: grid;
      }
      .conversation-layout {
        grid-template-columns: 1fr;
      }
      .run-sidebar {
        position: static;
      }
      .run-matrix-row {
        grid-template-columns: 1fr;
      }
      .run-matrix-head {
        display: none;
      }
      .conversation-side {
        text-align: left;
        justify-items: start;
      }
    }
  </style>
</head>
<body>
  <header>
      <div style="font-weight: 800; letter-spacing: 0; color: var(--dark-matter); font-family:'Space Grotesk','Inter',sans-serif;">LLM Advisors</div>
    <nav>
      <a href="{{ url_for('home') }}">Start</a>
      <a href="{{ url_for('list_conversations') }}">Conversations</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
